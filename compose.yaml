name: devforge

services:
  postgres:
    image: postgres:18
    container_name: devforge-postgres
    environment:
      POSTGRES_DB: devforge
      POSTGRES_USER: devforge
      POSTGRES_PASSWORD: devforge
    ports:
      - "5432:5432"
    volumes:
      - devforge-postgres-data:/var/lib/postgresql

volumes:
  devforge-postgres-data:
    name: devforge-postgres-data
